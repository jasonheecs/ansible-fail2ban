---
dependency:
  name: galaxy
  options:
    ignore-errors: true

driver:
  name: podman

platforms:
  - name: instance
    image: geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    pre_build_image: true
    systemd: always

provisioner:
  name: ansible

scenario:
  name: default

  test_sequence:
    - syntax
    - converge
    - idempotence
    - verify
    - destroy
