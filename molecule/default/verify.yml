---
- name: Verify
  hosts: all
  become: yes
  tasks:
    - name: Check auth.log exists
      ansible.builtin.stat:
        path: /var/log/auth.log
      register: auth_log

    - name: Assert auth.log exists
      ansible.builtin.assert:
        that: auth_log.stat.exists
        fail_msg: "/var/log/auth.log does not exist"

    - name: Check fail2ban is installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert fail2ban is installed
      ansible.builtin.assert:
        that: "'fail2ban' in ansible_facts.packages"
        fail_msg: "fail2ban is not installed"

    - name: Check jail.local exists
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: jail_local

    - name: Assert jail.local exists
      ansible.builtin.assert:
        that: jail_local.stat.exists
        fail_msg: "/etc/fail2ban/jail.local does not exist"

    - name: Check fail2ban.local exists
      ansible.builtin.stat:
        path: /etc/fail2ban/fail2ban.local
      register: fail2ban_local

    - name: Assert fail2ban.local exists
      ansible.builtin.assert:
        that: fail2ban_local.stat.exists
        fail_msg: "/etc/fail2ban/fail2ban.local does not exist"

    - name: Check fail2ban service is running and enabled
      ansible.builtin.service_facts:

    - name: Assert fail2ban is running
      ansible.builtin.assert:
        that: ansible_facts.services['fail2ban.service'].state == 'running'
        fail_msg: "fail2ban service is not running"

    - name: Assert fail2ban is enabled
      ansible.builtin.assert:
        that: ansible_facts.services['fail2ban.service'].status == 'enabled'
        fail_msg: "fail2ban service is not enabled"