---
- name: Create auth log if it does not exist
  ansible.builtin.file:
    path: /var/log/auth.log
    state: touch
    mode: "0640"
    owner: root
    group: "{{ 'adm' if ansible_facts['os_family'] == 'Debian' else 'root' }}"
    modification_time: preserve
    access_time: preserve

- name: Install EPEL repository (RedHat only)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Ensure fail2ban is installed (Debian)
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
  notify: Restart fail2ban

- name: Ensure fail2ban is installed (RedHat)
  ansible.builtin.dnf:
    name: fail2ban
    state: present
  when: ansible_facts['os_family'] == 'RedHat'
  notify: Restart fail2ban

- name: Ensure fail2ban is configured
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/fail2ban/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - jail.local
    - fail2ban.local
  notify: Restart fail2ban

- name: Wait for systemd to be ready
  ansible.builtin.service_facts:
  register: service_state
  until: service_state.ansible_facts.services['systemd-journald.service'] is defined
  retries: 10
  delay: 2

- name: Ensure fail2ban starts when machine is rebooted
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
