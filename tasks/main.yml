---
- name: Create auth log if it does not exist
  ansible.builtin.file:
    path: /var/log/auth.log
    state: touch
    mode: "0640"
    owner: root
    group: adm
    modification_time: preserve
    access_time: preserve

- name: Ensure fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  notify: Restart fail2ban

- name: Ensure fail2ban is configured
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/fail2ban/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - jail.local
    - fail2ban.local
  notify: Restart fail2ban

- name: Wait for systemd to be ready
  ansible.builtin.command: systemctl is-system-running --wait
  register: systemd_state
  changed_when: false
  failed_when: systemd_state.stdout not in ['running', 'degraded']

- name: Ensure fail2ban starts when machine is rebooted
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
